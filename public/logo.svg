<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lina">
  <title>Lina</title>
  <defs>
    <linearGradient id="linaSheen" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ededed"/>
      <stop offset="1" stop-color="#bfbfbf"/>
    </linearGradient>
    <linearGradient id="linaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="linaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#linaBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>

  <!-- HUD corner brackets -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" fill="none" stroke-linecap="square">
    <path d="M64 132 V64 H132"/>
    <path d="M380 64 H448 V132"/>
    <path d="M448 380 V448 H380"/>
    <path d="M132 448 H64 V380"/>
  </g>

  <!-- signal trace + node -->
  <path d="M232 152 H344" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"/>
  <g filter="url(#linaGlow)">
    <circle cx="384" cy="152" r="30" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="384" cy="152" r="8" fill="#ffffff"/>
  </g>

  <!-- cyber "L" -->
  <path d="M200 120 L232 120 L232 320 L368 320 L368 352 L336 384 L168 384 L168 152 Z"
        fill="url(#linaSheen)"/>

  <!-- digital slots -->
  <g fill="#050505">
    <rect x="184" y="164" width="32" height="12" rx="6"/>
    <rect x="184" y="204" width="32" height="12" rx="6"/>
    <rect x="184" y="244" width="32" height="12" rx="6"/>
    <rect x="198" y="336" width="12" height="32" rx="6"/>
    <rect x="238" y="336" width="12" height="32" rx="6"/>
    <rect x="278" y="336" width="12" height="32" rx="6"/>
  </g>
</svg>
